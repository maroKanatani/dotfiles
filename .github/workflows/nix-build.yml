name: 'CI: Nix build'

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Check if Nix-related files changed
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'zsh/**'
              - '.github/workflows/nix-build.yml'
              - '.github/actions/setup-nix/**'

  # Security gate: scan the repo for hidden content and config poisoning
  # before any build runs. Build jobs depend on this passing.
  security:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan repository
        uses: sheeki03/tirith@595f5adadaa151012cff0e3b7fa25f8d1599c92d # v0.3.3
        env:
          # v0.3.3 install.sh loses its local tmpdir before its EXIT trap runs.
          tmpdir: ${{ runner.temp }}/tirith-action-cleanup
        with:
          version: '0.3.3'
          fail_on: high
          sarif: 'false'
          ignore: '.git/**,*.pdf,.github/actions/setup-nix/action.yml'

  build-ubuntu:
    needs: [changes, security]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Skip if no Nix changes
        if: needs.changes.outputs.nix != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Nix-related changes detected, skipping build"

      - name: Checkout repository
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Nix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix

      - name: Build managed packages
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build .#default \
            --print-build-logs \
            --show-trace

  build-ubuntu-arm:
    needs: [changes, security]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Skip if no Nix changes
        if: needs.changes.outputs.nix != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "No Nix-related changes detected, skipping build"

      - name: Checkout repository
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Nix
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-nix

      - name: Build managed packages for aarch64
        if: needs.changes.outputs.nix == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          nix build .#default \
            --print-build-logs \
            --show-trace
